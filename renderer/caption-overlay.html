<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8"/>
  <title>Sinalize — Legendas</title>
  <link rel="preconnect" href="https://fonts.googleapis.com"/>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Geist:wght@300..900&family=Inter:wght@300..900&display=swap"/>
  <style>
    :root {
      --font: 'Inter';
      --size: 32px;
      --weight: 600;
      --color: #ffffff;
      --bg: rgba(0, 0, 0, 0.6);
      --lh: 1.3;
      --lines: 2;
      --pad: 11px;
    }

    html, body {
      margin: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: transparent;
      -webkit-user-select: none;
      user-select: none;
    }

    #stage {
      position: absolute;
      inset: 0 0 8px;
      display: flex;
      align-items: flex-end;
      justify-content: center;
    }

    #box {
      max-width: 100%;
      box-sizing: border-box;
      padding: var(--pad) calc(var(--pad) * 1.6);
      border-radius: 10px;
      background: var(--bg);
      opacity: 0;
      transition: opacity 0.18s ease;
    }

    #box.shown { opacity: 1; }

    /* Mostra só as últimas N linhas: o excesso transborda (e é cortado) por cima */
    #clip {
      max-height: calc(var(--size) * var(--lh) * var(--lines));
      overflow: hidden;
      display: flex;
      flex-direction: column;
      justify-content: flex-end;
    }

    #text {
      font-family: var(--font), 'Segoe UI', system-ui, sans-serif;
      font-size: var(--size);
      font-weight: var(--weight);
      line-height: var(--lh);
      color: var(--color);
      text-align: center;
      overflow-wrap: anywhere;
    }

    body.outline #text {
      -webkit-text-stroke: calc(var(--size) * 0.07) rgba(0, 0, 0, 0.92);
      paint-order: stroke fill;
    }

    body.shadow #text { text-shadow: 0 2px 6px rgba(0, 0, 0, 0.85); }

    .edit-layer { display: none; }
    body.editing .edit-layer { display: block; }

    .frame {
      position: absolute;
      inset: 0;
      border: 2px dashed rgba(59, 130, 246, 0.95);
      border-radius: 10px;
      background: rgba(59, 130, 246, 0.07);
      -webkit-app-region: drag;
      cursor: move;
    }

    .hint {
      position: absolute;
      top: 4px;
      left: 8px;
      padding: 2px 8px;
      border-radius: 6px;
      background: rgba(15, 23, 42, 0.85);
      color: #e2e8f0;
      font: 600 11px 'Segoe UI', system-ui, sans-serif;
    }

    .handle {
      position: absolute;
      top: 50%;
      width: 10px;
      height: 44px;
      margin-top: -22px;
      border-radius: 5px;
      background: rgba(37, 99, 235, 0.95);
      cursor: ew-resize;
      -webkit-app-region: no-drag;
      touch-action: none;
    }

    .handle.left { left: 2px; }
    .handle.right { right: 2px; }
  </style>
</head>
<body class="editing shadow">
  <div id="stage">
    <div id="box"><div id="clip"><div id="text"></div></div></div>
  </div>
  <div class="edit-layer">
    <div class="frame" title="Arraste para mover"></div>
    <span class="hint">Legendas · arraste para mover, alças ajustam a largura</span>
    <div class="handle left" data-dir="-1" title="Largura"></div>
    <div class="handle right" data-dir="1" title="Largura"></div>
  </div>

  <script>
    const SAMPLE = 'Exemplo de legenda do Sinalize. Ajuste posição, largura e estilo.'
    const MAX_FINALS = 20
    const box = document.getElementById('box')
    const textEl = document.getElementById('text')

    let caption = null
    let editing = true
    let finals = [] // { seg, text, state }
    let partial = null
    let hideTimer = null

    // live: fala em tempo real (inclui o trecho provisório) · final: só texto consolidado
    // signing: frase entregue ao player; o VLibras não expõe progresso por sinal, então não há sincronia fina.
    function currentText() {
      if (caption.source === 'signing') return finals.find((f) => f.state === 'signing')?.text || ''
      const parts = finals.map((f) => f.text)
      if (caption.source === 'live' && partial) parts.push(partial.text)
      return parts.slice(-6).join(' ')
    }

    function show(text, sample = false) {
      textEl.textContent = text
      box.dataset.sample = sample ? '1' : ''
      box.classList.add('shown')
    }

    const hide = () => box.classList.remove('shown')

    function render() {
      if (!caption) return
      clearTimeout(hideTimer)
      const text = currentText()
      if (text) show(text)
      else if (editing) show(SAMPLE, true)
      else if (box.dataset.sample) hide()
      if (editing || caption.holdMs === 0) return
      // Tempo de permanência após o término da fala (ou do segmento em sinalização).
      if (caption.source !== 'signing' || !text) hideTimer = setTimeout(hide, caption.holdMs)
    }

    function onCaptionEvent(ev) {
      if (ev.kind === 'final') {
        finals = finals.filter((f) => f.seg !== ev.seg)
        finals.push({ seg: ev.seg, text: ev.text, state: 'pending' })
        finals = finals.slice(-MAX_FINALS)
        if (partial?.seg === ev.seg) partial = null
      } else if (ev.kind === 'partial') {
        partial = { seg: ev.seg, text: ev.text }
      } else if (ev.kind === 'state') {
        const f = finals.find((x) => x.seg === ev.seg)
        if (f) f.state = ev.state
      } else if (ev.kind === 'clear') {
        finals = []
        partial = null
      }
      render()
    }

    function hexToRgba(hex, alpha) {
      const n = parseInt(hex.slice(1), 16)
      return `rgba(${n >> 16}, ${(n >> 8) & 255}, ${n & 255}, ${alpha})`
    }

    function applyState(state) {
      const c = state.settings.caption
      const css = document.documentElement.style
      css.setProperty('--font', `'${c.fontFamily}'`)
      css.setProperty('--size', `${c.fontSize}px`)
      css.setProperty('--weight', String(c.fontWeight))
      css.setProperty('--color', c.color)
      css.setProperty('--bg', hexToRgba(c.bgColor, c.bgOpacity))
      css.setProperty('--lh', String(c.lineHeight))
      css.setProperty('--lines', String(c.maxLines))
      css.setProperty('--pad', `${Math.round(c.fontSize * 0.35)}px`)
      document.body.classList.toggle('outline', c.outline)
      document.body.classList.toggle('shadow', c.shadow)
      document.body.classList.toggle('editing', state.editing)
      caption = c
      editing = state.editing
      render()
    }

    window.sinalize.overlay.get().then(applyState)
    window.sinalize.overlay.onState(applyState)
    window.sinalize.caption.onEvent(onCaptionEvent)

    // Largura simétrica: a legenda continua centrada enquanto a alça é arrastada.
    for (const handle of document.querySelectorAll('.handle')) {
      handle.addEventListener('pointerdown', (e) => {
        handle.setPointerCapture(e.pointerId)
        const dir = Number(handle.dataset.dir)
        const startX = e.screenX
        const startW = window.innerWidth
        let raf = 0
        const move = (ev) => {
          cancelAnimationFrame(raf)
          raf = requestAnimationFrame(() => {
            window.sinalize.overlay.command('resizeCaption', Math.round(startW + 2 * dir * (ev.screenX - startX)))
          })
        }
        const end = () => {
          handle.removeEventListener('pointermove', move)
          handle.removeEventListener('pointerup', end)
          handle.removeEventListener('pointercancel', end)
        }
        handle.addEventListener('pointermove', move)
        handle.addEventListener('pointerup', end)
        handle.addEventListener('pointercancel', end)
      })
    }
  </script>
</body>
</html>
