<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8"/>
  <title>Sinalcast — Avatar</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      background: #000;
      width: 100vw;
      height: 100vh;
      overflow: hidden;
    }

    #caption {
      position: fixed;
      bottom: 0;
      left: 0;
      right: 0;
      color: #fff;
      font-family: 'Segoe UI', sans-serif;
      font-size: 3rem;
      font-weight: 600;
      text-align: center;
      padding: 28px 40px 36px;
      z-index: 9999;
      background: linear-gradient(to top, rgba(0,0,0,0.92) 0%, rgba(0,0,0,0.7) 70%, transparent 100%);
      text-shadow: 0 2px 8px rgba(0,0,0,0.9);
      line-height: 1.2;
      min-height: 120px;
      transition: opacity 0.2s;
    }

    #caption:empty {
      opacity: 0;
    }

    #brand {
      position: fixed;
      top: 16px;
      left: 20px;
      color: #7c5cfc;
      font-family: 'Segoe UI', sans-serif;
      font-size: 0.9rem;
      font-weight: 600;
      letter-spacing: 2px;
      z-index: 9999;
      opacity: 0.7;
      text-shadow: 0 1px 4px rgba(0,0,0,0.8);
    }

    /* Esconde o botão de acessibilidade e barra de texto */
    [vw-access-button] { opacity: 0 !important; pointer-events: none !important; position: fixed !important; }

    /* Força o widget VLibras a ocupar tela toda */
    [vw],
    [vw-plugin-wrapper],
    .vw-plugin-top-wrapper,
    .vw-plugin-top-wrapper > div,
    .vw-plugin-top-wrapper iframe {
      position: fixed !important;
      inset: 0 !important;
      width: 100vw !important;
      height: 100vh !important;
      max-width: 100vw !important;
      max-height: 100vh !important;
      min-width: 100vw !important;
      min-height: 100vh !important;
      margin: 0 !important;
      padding: 0 !important;
      border: none !important;
      transform: none !important;
      left: 0 !important;
      top: 0 !important;
      right: 0 !important;
      bottom: 0 !important;
    }
  </style>
</head>
<body>

  <div vw class="enabled">
    <div vw-access-button class="active"></div>
    <div vw-plugin-wrapper>
      <div class="vw-plugin-top-wrapper"></div>
    </div>
  </div>

  <div id="brand">🤟 SINALIZE</div>
  <div id="caption"></div>

  <script src="https://vlibras.gov.br/app/vlibras-plugin.js"></script>
  <script>
    new window.VLibras.Widget({
      rootPath: 'https://vlibras.gov.br/app',
      avatar: 'icaro',
      opacity: 1,
      position: 'R'
    })

    const caption = document.getElementById('caption')

    // Aguarda o widget carregar e abre automaticamente
    let widgetOpened = false
    const waitWidget = setInterval(() => {
      if (window.VLibrasWidget && typeof window.VLibrasWidget.open === 'function') {
        window.VLibrasWidget.open()
        widgetOpened = true
      }
      const accessWrapper = document.getElementById('vlibras-access-wrapper')
      if (accessWrapper && accessWrapper.shadowRoot) {
        const btn = accessWrapper.shadowRoot.querySelector('#vlibras-button')
        if (btn) {
          btn.click()
          widgetOpened = true
        }
      }
      const accessBtn = document.querySelector('[vw-access-button]')
      if (accessBtn) {
        accessBtn.click()
        widgetOpened = true
      }
      if (widgetOpened && (window.plugin?.translate || window.vlibras?.translateAndPlay)) {
        clearInterval(waitWidget)
      }
    }, 500)

    function doTranslate(text) {
      if (!text || !text.trim()) return false

      // 1. Novo VLibras v7 (window.plugin.translate)
      if (window.plugin && typeof window.plugin.translate === 'function') {
        window.plugin.translate(text)
        return true
      }
      // 2. Novo VLibras v7 via window.vlibras
      if (window.vlibras && typeof window.vlibras.translateAndPlay === 'function') {
        window.vlibras.translateAndPlay(text)
        return true
      }
      if (window.vlibras && typeof window.vlibras.translate === 'function') {
        window.vlibras.translate(text)
        return true
      }
      // 3. VLibras legado (window.plugin.player.translate)
      if (window.plugin && window.plugin.player && typeof window.plugin.player.translate === 'function') {
        window.plugin.player.translate(text)
        return true
      }
      return false
    }

    // Recebe texto do main.js via IPC
    const { ipcRenderer } = require('electron')

    ipcRenderer.on('translate', (event, text) => {
      caption.textContent = text

      // Tenta imediatamente
      if (doTranslate(text)) return

      // Se o widget ainda estiver carregando, tenta repetidamente por até 30s
      let elapsed = 0
      const tryTranslate = setInterval(() => {
        elapsed += 300
        if (doTranslate(text) || elapsed >= 30000) {
          clearInterval(tryTranslate)
        }
      }, 300)
    })
  </script>

</body>
</html>
