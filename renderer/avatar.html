<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Sinalize — Avatar</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      -webkit-user-select: none;
      user-select: none;
    }

    body {
      background: radial-gradient(circle at 50% 38%, #171b2c 0%, #0b0d14 70%);
      color: #f8fafc;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      width: 100vw;
      height: 100vh;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      position: relative;
    }

    /* === Header Superior Minimalista === */
    .top-bar {
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      height: 48px;
      padding: 0 16px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      background: rgba(11, 13, 20, 0.72);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      border-bottom: 1px solid rgba(255, 255, 255, 0.07);
      z-index: 10000;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 0.95rem;
      font-weight: 700;
      letter-spacing: 0.5px;
      color: #f1f5f9;
    }

    .brand-name {
      background: linear-gradient(135deg, #ffffff 40%, #a78bfa 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    /* Badge de status em tempo real */
    .status-badge {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      font-size: 0.72rem;
      font-weight: 600;
      padding: 4px 10px;
      border-radius: 9999px;
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid rgba(255, 255, 255, 0.08);
      color: #94a3b8;
      transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
    }

    .status-dot {
      width: 7px;
      height: 7px;
      border-radius: 50%;
      background: #64748b;
      transition: all 0.3s ease;
    }

    /* Estado Pronto */
    .status-badge.ready {
      background: rgba(16, 185, 129, 0.08);
      border-color: rgba(16, 185, 129, 0.25);
      color: #34d399;
    }
    .status-badge.ready .status-dot {
      background: #10b981;
      box-shadow: 0 0 8px rgba(16, 185, 129, 0.6);
    }

    /* Estado Ao vivo (Gravando áudio) */
    .status-badge.live {
      background: rgba(239, 68, 68, 0.12);
      border-color: rgba(239, 68, 68, 0.35);
      color: #f87171;
    }
    .status-badge.live .status-dot {
      background: #ef4444;
      box-shadow: 0 0 10px rgba(239, 68, 68, 0.8);
      animation: pulse-live 1.2s infinite ease-in-out;
    }

    @keyframes pulse-live {
      0%, 100% {
        transform: scale(1);
        opacity: 1;
      }
      50% {
        transform: scale(1.4);
        opacity: 0.6;
      }
    }

    /* === Palco Central do Avatar === */
    #avatar-stage {
      position: absolute;
      top: 48px;
      bottom: 96px;
      left: 0;
      right: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
      z-index: 1;
    }

    /* Ajustes para o Widget VLibras preencher harmoniosamente o palco sem bordas pretas */
    #vlibras-access-wrapper,
    [vw-access-button] {
      display: none !important;
      opacity: 0 !important;
      pointer-events: none !important;
    }

    [vw],
    [vw-plugin-wrapper],
    .vw-plugin-top-wrapper,
    #vlibras-app-root {
      width: 100% !important;
      height: 100% !important;
      max-width: 100% !important;
      max-height: 100% !important;
      border: none !important;
      background: transparent !important;
    }

    /* Centraliza o container interno do VLibras */
    #vlibras-app {
      position: relative !important;
      top: auto !important;
      left: auto !important;
      right: auto !important;
      bottom: auto !important;
      margin: auto !important;
      border-radius: 16px !important;
      box-shadow: 0 16px 40px rgba(0, 0, 0, 0.5) !important;
      max-width: 94% !important;
      max-height: 94% !important;
    }

    /* === Card de Legenda (Closed Caption) Estilizado === */
    .caption-container {
      position: absolute;
      bottom: 16px;
      left: 16px;
      right: 16px;
      min-height: 64px;
      max-height: 120px;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 12px 20px;
      border-radius: 14px;
      background: rgba(17, 24, 39, 0.85);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      border: 1px solid rgba(255, 255, 255, 0.1);
      box-shadow: 0 12px 32px rgba(0, 0, 0, 0.45);
      z-index: 10000;
      transition: transform 0.25s cubic-bezier(0.4, 0, 0.2, 1), opacity 0.25s ease;
    }

    #caption {
      color: #f8fafc;
      font-size: 1.15rem;
      font-weight: 600;
      line-height: 1.35;
      text-align: center;
      letter-spacing: 0.2px;
      text-shadow: 0 1px 4px rgba(0, 0, 0, 0.8);
      word-break: break-word;
      transition: opacity 0.2s ease;
    }

    #caption.placeholder {
      font-size: 0.82rem;
      font-weight: 500;
      color: #64748b;
      letter-spacing: 0.3px;
    }

    /* Efeito de atualização do texto */
    .caption-flash {
      animation: caption-pop 0.3s ease-out;
    }

    @keyframes caption-pop {
      0% {
        transform: scale(0.97);
        opacity: 0.7;
      }
      100% {
        transform: scale(1);
        opacity: 1;
      }
    }
  </style>
</head>
<body>

  <!-- Barra de status superior minimalista -->
  <header class="top-bar">
    <div class="brand">
      <span class="brand-name">Sinalize</span>
    </div>
    <div id="statusBadge" class="status-badge ready">
      <span class="status-dot"></span>
      <span id="statusBadgeText">Pronto</span>
    </div>
  </header>

  <!-- Palco do Avatar VLibras -->
  <main id="avatar-stage">
    <div vw class="enabled">
      <div vw-access-button class="active"></div>
      <div vw-plugin-wrapper>
        <div class="vw-plugin-top-wrapper"></div>
      </div>
    </div>
  </main>

  <!-- Card de Legenda (Closed Caption) Glassmorphism -->
  <footer class="caption-container">
    <div id="caption" class="placeholder">Aguardando fala ou texto para sinalizar...</div>
  </footer>

  <!-- Script Oficial VLibras -->
  <script src="https://vlibras.gov.br/app/vlibras-plugin.js"></script>
  <script>
    // Inicialização do Widget VLibras
    new window.VLibras.Widget({
      rootPath: 'https://vlibras.gov.br/app',
      avatar: 'icaro',
      opacity: 1,
      position: 'R'
    })

    const caption = document.getElementById('caption')
    const statusBadge = document.getElementById('statusBadge')
    const statusBadgeText = document.getElementById('statusBadgeText')

    // Controle de abertura automática do widget
    let widgetOpened = false
    const waitWidget = setInterval(() => {
      if (window.VLibrasWidget && typeof window.VLibrasWidget.open === 'function') {
        window.VLibrasWidget.open()
        widgetOpened = true
      }
      const accessWrapper = document.getElementById('vlibras-access-wrapper')
      if (accessWrapper && accessWrapper.shadowRoot) {
        const btn = accessWrapper.shadowRoot.querySelector('#vlibras-button')
        if (btn) {
          btn.click()
          widgetOpened = true
        }
      }
      const accessBtn = document.querySelector('[vw-access-button]')
      if (accessBtn) {
        accessBtn.click()
        widgetOpened = true
      }
      if (widgetOpened && (window.plugin?.translate || window.vlibras?.translateAndPlay)) {
        clearInterval(waitWidget)
      }
    }, 400)

    // Função de tradução com suporte amplo ao VLibras v7 e versões anteriores
    function doTranslate(text) {
      if (!text || !text.trim()) return false

      // 1. VLibras v7 padrão (window.plugin.translate)
      if (window.plugin && typeof window.plugin.translate === 'function') {
        window.plugin.translate(text)
        return true
      }
      // 2. VLibras v7 via window.vlibras
      if (window.vlibras && typeof window.vlibras.translateAndPlay === 'function') {
        window.vlibras.translateAndPlay(text)
        return true
      }
      if (window.vlibras && typeof window.vlibras.translate === 'function') {
        window.vlibras.translate(text)
        return true
      }
      // 3. Fallback legado (window.plugin.player.translate)
      if (window.plugin && window.plugin.player && typeof window.plugin.player.translate === 'function') {
        window.plugin.player.translate(text)
        return true
      }
      return false
    }

    // Comunicação IPC com o processo Electron
    const { ipcRenderer } = require('electron')

    // Recebe texto traduzido da janela de controle
    ipcRenderer.on('translate', (event, text) => {
      const cleanText = (text || '').trim()
      if (!cleanText) return

      caption.classList.remove('placeholder')
      caption.textContent = cleanText

      // Efeito sutil de transição ao atualizar a legenda
      const container = document.querySelector('.caption-container')
      if (container) {
        container.classList.remove('caption-flash')
        void container.offsetWidth // Trigger reflow
        container.classList.add('caption-flash')
      }

      // Executa a tradução no avatar
      if (doTranslate(cleanText)) return

      // Tenta novamente enquanto o motor do avatar carrega os chunks
      let elapsed = 0
      const retry = setInterval(() => {
        elapsed += 300
        if (doTranslate(cleanText) || elapsed >= 25000) {
          clearInterval(retry)
        }
      }, 300)
    })

    // Sincroniza o indicador de status (Ao vivo vs Pronto)
    ipcRenderer.on('recording-status', (event, isRecording) => {
      if (isRecording) {
        statusBadge.className = 'status-badge live'
        statusBadgeText.textContent = 'Ao vivo'
      } else {
        statusBadge.className = 'status-badge ready'
        statusBadgeText.textContent = 'Pronto'
      }
    })
  </script>

</body>
</html>
